name: build

# Builds macOS (.dmg/.app), Windows (NSIS .exe) and Linux
# (.deb/.rpm) installers. Each platform's installer can only be
# produced on its own runner — hence the matrix. On a `v*` tag push the
# installers are also attached to a draft GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        required: true
        default: mac-windows-test
        options:
          - mac-windows-test
          - full

# The final manifest job creates the draft release only after every package gate passes.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || inputs.profile == 'full') && '[{"platform":"macos-15","target":"aarch64-apple-darwin"},{"platform":"macos-15-intel","target":"x86_64-apple-darwin"},{"platform":"windows-2022","target":"x86_64-pc-windows-msvc"},{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}]' || '[{"platform":"macos-15-intel","target":"x86_64-apple-darwin"},{"platform":"windows-2022","target":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev rpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pinned Bun for the reviewed OpenCode build
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce reviewed JavaScript dependency security pins
        run: python scripts/dev/test_js_security_policy.py -v

      - name: Fetch bundled goal plugin
        shell: bash
        run: bash scripts/dev/fetch-goal-plugin.sh

      - name: Fetch bundled browser sidecar and license
        shell: bash
        run: bash scripts/dev/fetch-agent-browser.sh ${{ matrix.target }}

      - name: Validate pinned sidecar archive integrity
        run: python scripts/dev/test_sidecar_integrity.py -v

      - name: Validate reviewed OpenCode source patch contract
        run: python scripts/dev/test_patched_opencode.py -v

      - name: Test release evidence contracts
        run: python scripts/release/test_release_evidence.py -v

      - name: Test packaged OpenCode context-audit fixture contracts
        run: python scripts/release/test_packaged_opencode_fixture.py -v

      - name: Test macOS distribution contracts
        if: startsWith(matrix.platform, 'macos')
        run: python scripts/release/test_macos_distribution.py -v

      - name: Require macOS distribution credentials for tagged releases
        if: startsWith(matrix.platform, 'macos') && github.ref_type == 'tag'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/release/check_macos_release_credentials.py

      - name: Fetch bundled OpenCode sidecar
        shell: bash
        run: bash scripts/dev/fetch-opencode.sh ${{ matrix.target }}

      - name: Fetch pinned Open Science Skill pack
        shell: bash
        run: bash scripts/dev/fetch-skills.sh

      - name: Test release-resource preflight contracts
        run: python scripts/release/test_resource_preflight.py -v

      - name: Block releases that regress the Open Science foundation
        run: python scripts/dev/test_open_science_foundation.py -v

      - name: Validate third-party asset admission registry
        run: python scripts/dev/test_asset_admission.py -v

      - name: Validate first-party core Skills
        run: python scripts/dev/test_core_skills.py -v

      - name: Validate localized AI4HEOR product documentation
        run: python scripts/dev/test_ai4heor_product_docs.py -v

      - name: Validate researcher-led AI4HEOR harness
        run: python scripts/dev/test_heor_harness.py -v

      - name: Test methods watchlist contract
        run: python scripts/dev/test_heor_methods_watchlist.py -v

      - name: Validate packaged HEOR Python resources
        run: python scripts/dev/test_tauri_heor_resources.py -v
      - name: Test bounded network meta-analysis contracts
        run: python scripts/dev/test_network_meta_analysis.py -v
      - name: Test bounded anchored MAIC contracts
        run: python scripts/dev/test_population_adjusted_comparison.py -v
      - name: Test bounded RWE causal-analysis contracts
        run: python scripts/dev/test_rwe_causal_analysis.py -v

      - name: Test bounded semi-Markov microsimulation contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/dev/test_semi_markov_microsimulation.py -v

      - name: Fetch bundled uv sidecar
        shell: bash
        run: bash scripts/dev/fetch-uv.sh ${{ matrix.target }}

      - name: Test embedded local history without system Git
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          cargo test `
            --manifest-path apps/desktop/src-tauri/Cargo.toml `
            git_snapshot::tests `
            -- --nocapture

      - name: Run native desktop E2E smoke
        if: matrix.platform == 'macos-15-intel'
        run: pnpm test:e2e:desktop

      - name: Build the unsigned test app (Tauri)
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # Linux: deb+rpm only. AppImage is off because linuxdeploy runs ldd
          # on every bundled ELF and ldd exits 1 on the Bun-built opencode
          # sidecar, aborting the whole bundle (tauri-apps/tauri#8929).
          args: --target ${{ matrix.target }} ${{ startsWith(matrix.platform, 'macos') && '--bundles dmg' || startsWith(matrix.platform, 'windows') && '--bundles nsis' || '--bundles deb,rpm' }}

      - name: Build the signed macOS release app (Tauri)
        if: github.ref_type == 'tag' && startsWith(matrix.platform, 'macos')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles dmg

      - name: Build the non-macOS release packages (Tauri)
        if: github.ref_type == 'tag' && !startsWith(matrix.platform, 'macos')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} ${{ startsWith(matrix.platform, 'windows') && '--bundles nsis' || '--bundles deb,rpm' }}

      - name: Verify Linux installer contents and scientific resources
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          bundle_root="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          mapfile -t debs < <(find "$bundle_root/deb" -maxdepth 1 -type f -name '*.deb')
          mapfile -t rpms < <(find "$bundle_root/rpm" -maxdepth 1 -type f -name '*.rpm')
          test "${#debs[@]}" -eq 1
          test "${#rpms[@]}" -eq 1
          verification="$bundle_root/linux-x64-verification.json"
          python scripts/dev/verify_linux_packages.py \
            --deb "${debs[0]}" \
            --rpm "${rpms[0]}" \
            --verification-json "$verification"
          python scripts/release/release_evidence.py record \
            --platform linux \
            --target "${{ matrix.target }}" \
            --bundle "deb=${debs[0]}" \
            --bundle "rpm=${rpms[0]}" \
            --check package-metadata \
            --check deb-rpm-payload-parity \
            --check scientific-resources \
            --check packaged-heor-tests \
            --check bundled-sidecars \
            --verification-json "$verification" \
            --output "$bundle_root/linux-x64-release-evidence.json"

      - name: Verify macOS DMG contents and scientific resources
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          bundle_root="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          dmgs=("$bundle_root"/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          verification="$bundle_root/macos-${{ matrix.target }}-verification.json"
          trust_args=()
          trust_checks=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            trust_args+=(
              --require-distribution-trust
              --expected-team-id "$APPLE_TEAM_ID"
            )
            trust_checks+=(
              --check developer-id-signature
              --check gatekeeper-assessment
              --check hardened-runtime
              --check notarization-ticket
            )
          fi
          python scripts/release/verify_macos_package.py \
            --dmg "${dmgs[0]}" \
            --target "${{ matrix.target }}" \
            --verification-json "$verification" \
            --verify-first-launch \
            "${trust_args[@]}"
          python scripts/release/verify_packaged_opencode_fixture.py \
            --dmg "${dmgs[0]}" \
            --expected-version 1.0.0 \
            --verification-json "$verification"
          python scripts/release/release_evidence.py record \
            --platform macos \
            --target "${{ matrix.target }}" \
            --bundle "dmg=${dmgs[0]}" \
            --check bundle-metadata \
            --check macho-architecture \
            --check scientific-resources \
            --check packaged-heor-tests \
            --check bundled-sidecars \
            --check dmg-app-copy \
            --check first-launch-process \
            --check frontend-bootstrap \
            --check installed-task-ui \
            --check installed-task-reply \
            --check opencode-authenticated-http \
            --check opencode-system-context-audit \
            --check opencode-permission-persistence \
            --check workspace-created \
            --check workspace-isolated \
            "${trust_checks[@]}" \
            --verification-json "$verification" \
            --output "$bundle_root/macos-${{ matrix.target }}-release-evidence.json"

      - name: Verify the Windows installer, scientific resources, and first launch
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $bundleRoot = "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          $installers = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer; found $($installers.Count)." }
          ./scripts/release/verify-windows-package.ps1 `
            -NsisPath $installers[0].FullName `
            -EvidenceOut (Join-Path $bundleRoot 'windows-x64-release-evidence.json') `
            -EmbeddedLocalHistoryTested

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ai4s-workbench-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*-release-evidence.json
          if-no-files-found: error

  release-manifest:
    name: Assemble cross-platform release manifest
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download verified platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ai4s-workbench-*
          path: release-artifacts
      - name: Verify artifacts and assemble one source-bound manifest
        shell: bash
        run: |
          mapfile -t evidence < <(find release-artifacts -type f -name '*-release-evidence.json' | sort)
          common=(
            --artifact-root release-artifacts
            --require-platform macos
            --require-platform windows
            --require-target x86_64-apple-darwin
            --require-target x86_64-pc-windows-msvc
            --output ai4heor-release-manifest.json
          )
          if [[ "$GITHUB_EVENT_NAME" == "push" || "${{ inputs.profile }}" == "full" ]]; then
            test "${#evidence[@]}" -eq 4
            python scripts/release/release_evidence.py assemble "${evidence[@]}" \
              "${common[@]}" \
              --require-platform linux \
              --require-target aarch64-apple-darwin \
              --require-target x86_64-unknown-linux-gnu
          else
            test "${#evidence[@]}" -eq 2
            python scripts/release/release_evidence.py assemble "${evidence[@]}" "${common[@]}"
          fi
      - name: Upload cross-platform release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai4heor-release-manifest-${{ github.sha }}
          path: |
            ai4heor-release-manifest.json
            release-artifacts/**/*-release-evidence.json
          if-no-files-found: error
      - name: Create draft release from verified installers and evidence
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            ## Install & first launch

            **macOS** — Apple Silicon: `…_aarch64.dmg` · Intel: `…_x64.dmg` (requires macOS 13+)
            - Both apps passed Developer ID, hardened-runtime, stapled notarization-ticket, and Gatekeeper checks before this draft was created.
            - Open the DMG and drag **AI4HEOR** into Applications.

            **Windows** — `…_x64-setup.exe`
            - Windows installers are not yet Authenticode-signed. SmartScreen may show *"Windows protected your PC"* → **More info** → **Run anyway**.

            **Linux** — `.deb` / `.rpm`
            - `sudo apt install ./…_amd64.deb` or `sudo rpm -i …x86_64.rpm`

            The attached manifest and four platform-evidence files bind these installers to one source commit, workflow run, and scientific-resource inventory. This is not scientific validation or a reproducible-build attestation.
        run: |
          mapfile -t evidence < <(find release-artifacts -type f -name '*-release-evidence.json' | sort)
          mapfile -t installers < <(
            find release-artifacts -type f \( \
              -name '*.dmg' -o -name '*.exe' -o \
              -name '*.deb' -o -name '*.rpm' \
            \) | sort
          )
          test "${#evidence[@]}" -eq 4
          test "${#installers[@]}" -eq 5
          gh release create "$GITHUB_REF_NAME" \
            "${installers[@]}" \
            ai4heor-release-manifest.json \
            "${evidence[@]}" \
            --draft \
            --verify-tag \
            --title "AI4HEOR $GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES"
