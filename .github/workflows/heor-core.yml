name: HEOR core contracts

on:
  pull_request:
    paths:
      - "python/heor_core/**"
      - "runtime/skills/core/**"
      - "runtime/harness/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/src/**"
      - "runtime/assets/asset-admission-registry.json"
      - "scripts/dev/validate_asset_admission.py"
      - "scripts/dev/test_asset_admission.py"
      - "scripts/dev/test_core_skills.py"
      - "scripts/dev/test_heor_harness.py"
      - "scripts/dev/test_heor_artifact_contracts.py"
      - "scripts/dev/test_heor_local_evidence.py"
      - "scripts/dev/test_heor_methods_watchlist.py"
      - "scripts/dev/test_network_meta_analysis.py"
      - "scripts/dev/test_population_adjusted_comparison.py"
      - "scripts/dev/test_rwe_causal_analysis.py"
      - "scripts/dev/test_tauri_heor_resources.py"
      - "scripts/dev/fetch-opencode.sh"
      - "scripts/dev/fetch-uv.sh"
      - "scripts/dev/sidecar-checksums.sha256"
      - "scripts/dev/verify-sidecar-checksum.sh"
      - "scripts/dev/test_sidecar_integrity.py"
      - "scripts/dev/verify_linux_packages.py"
      - "scripts/release/**"
      - "docs/HEOR_*.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/heor-core.yml"
      - ".github/workflows/build.yml"
  push:
    branches: [master]
    paths:
      - "python/heor_core/**"
      - "runtime/skills/core/**"
      - "runtime/harness/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/src/**"
      - "runtime/assets/asset-admission-registry.json"
      - "scripts/dev/validate_asset_admission.py"
      - "scripts/dev/test_asset_admission.py"
      - "scripts/dev/test_core_skills.py"
      - "scripts/dev/test_heor_harness.py"
      - "scripts/dev/test_heor_artifact_contracts.py"
      - "scripts/dev/test_heor_local_evidence.py"
      - "scripts/dev/test_heor_methods_watchlist.py"
      - "scripts/dev/test_network_meta_analysis.py"
      - "scripts/dev/test_population_adjusted_comparison.py"
      - "scripts/dev/test_rwe_causal_analysis.py"
      - "scripts/dev/test_tauri_heor_resources.py"
      - "scripts/dev/fetch-opencode.sh"
      - "scripts/dev/fetch-uv.sh"
      - "scripts/dev/sidecar-checksums.sha256"
      - "scripts/dev/verify-sidecar-checksum.sh"
      - "scripts/dev/test_sidecar_integrity.py"
      - "scripts/dev/verify_linux_packages.py"
      - "scripts/release/**"
      - "docs/HEOR_*.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/heor-core.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test deterministic HEOR, uncertainty, and budget impact engines
        env:
          PYTHONPATH: ${{ github.workspace }}/python/heor_core/src
        run: python -m unittest discover -s python/heor_core/tests -v
      - name: Test portable HEOR artifact contracts
        run: python scripts/dev/test_heor_artifact_contracts.py -v
      - name: Test local evidence search contract
        run: python scripts/dev/test_heor_local_evidence.py -v
      - name: Test methods watchlist contract
        run: python scripts/dev/test_heor_methods_watchlist.py -v
      - name: Test bounded network meta-analysis contracts
        run: python scripts/dev/test_network_meta_analysis.py -v
      - name: Test bounded anchored MAIC contracts
        run: python scripts/dev/test_population_adjusted_comparison.py -v
      - name: Test bounded RWE causal-analysis contracts
        run: python scripts/dev/test_rwe_causal_analysis.py -v
      - name: Test third-party asset admission contract
        run: python scripts/dev/test_asset_admission.py -v
      - name: Validate first-party core Skills
        run: python scripts/dev/test_core_skills.py -v
      - name: Validate researcher-led AI4HEOR harness
        run: python scripts/dev/test_heor_harness.py -v
      - name: Validate packaged HEOR Python resources
        run: python scripts/dev/test_tauri_heor_resources.py -v
      - name: Validate pinned sidecar archive integrity
        run: python scripts/dev/test_sidecar_integrity.py -v
      - name: Test release evidence contracts
        run: python scripts/release/test_release_evidence.py -v

  native:
    name: Native contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Test native HEOR audit and execution contracts
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  frontend:
    name: Frontend contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
