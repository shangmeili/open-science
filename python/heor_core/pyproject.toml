[project]
name = "heor-core"
version = "0.1.0"
description = "Deterministic pharmacoeconomic analysis core for HEOR Workbench"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
heor-core = "heor_core.cli:main"

[build-system]
requires = ["setuptools>=75"]
